spring.application.name=backend-pixelbase
# Puerto dinámico asignado por la red interna del PaaS (DigitalOcean/Render).
server.port=${PORT}
# Control de perfiles. Fallback automático a 'dev' si se ejecuta sin flags.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# --------------------------------------------------------------------
# CONEXIÓN A BASE DE DATOS (POSTGRESQL)
# --------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# --------------------------------------------------------------------
# CONFIGURACIÓN ORM (JPA / HIBERNATE)
# --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
# --------------------------------------------------------------------
# SEGURIDAD, JWT Y CONTROL DE CORS
# --------------------------------------------------------------------
# Orígenes permitidos (separados por coma). Ej: http://localhost:4200
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Firma criptográfica del token (Mínimo 32 caracteres / 256 bits de longitud).
jwt.secret=${JWT_SECRET}
# Tiempo de vida del Token en milisegundos (Ej.: 86400000 = 24 Horas).
jwt.expiration=${JWT_EXPIRATION}
# --------------------------------------------------------------------
# CLOUDINARY CONFIG (ALMACENAMIENTO DE IMÁGENES)
# --------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# --------------------------------------------------------------------
# CONFIGURACIÓN DE MULTIPART PARA SUBIDA DE ARCHIVOS
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}
# --------------------------------------------------------------------
# CONFIGURACIÓN DE MIGRACIONES (FLYWAY)
# --------------------------------------------------------------------
# Activa Flyway en el ecosistema
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Ubicación estándar de tus scripts SQL
spring.flyway.locations=classpath:db/migration
# Evita fallos si necesitas sincronizar bases de datos con estados previos
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
